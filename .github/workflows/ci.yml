# OfficerPath AI — PDF Engine CI (Phase 1, M1; Phase 2 M2 adds the web job)
# Runs on every push / pull request to main, officerpath-phase1-engine
# or officerpath-phase2-web.
# Gates: ruff (lint + format), mypy (new M1 packages), pytest, pip-audit
# (dependency audit), detect-secrets (secret scan), Alembic up/down on
# SQLite, Docker image build, and the Next.js web job (typecheck, lint,
# build). Does NOT deploy, does NOT touch live Supabase, does NOT push
# any image. Deploy is a separate, owner-approved step
# (docs/deploy-render.md, docs/phase2/06-deployment-plan.md).
name: CI

on:
  push:
    branches: [main, officerpath-phase1-engine, officerpath-phase2-web]
  pull_request:
    branches: [main, officerpath-phase1-engine, officerpath-phase2-web]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # CI FIX (2026-11-23, run #3): `next build` prerenders the
    # dashboard/admin layouts, whose server client throws unless the
    # public Supabase vars exist. Locally web/.env.local provides
    # them; CI has no .env.local, so the vars come from repository
    # secrets (all NEXT_PUBLIC_* — publishable by design; the anon
    # key is already embedded in every client bundle). API_URL is the
    # live Render backend so the build matches production; SITE_URL is
    # intentionally unset here (lib/site.ts falls back to the
    # officerpath.ai placeholder — the production domain is still
    # unconfirmed and this build artifact is never deployed).
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Mypy (M1 packages)
        run: mypy app/db app/pipeline app/storage

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # M3: the Tesseract tests run the real binary (eng+urd). Without
      # these packages the adapter reports unavailable and the tests
      # fail. PaddleOCR is NOT run in unit tests (parse-only tests +
      # the benchmark script), so no model download happens in CI.
      - name: Install Tesseract (system binary + language data)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-urd tesseract-ocr-ara
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Alembic up/down (SQLite test target)
        env:
          DATABASE_URL: sqlite:////tmp/officerpath-ci-test.db
        run: |
          rm -f /tmp/officerpath-ci-test.db
          python -c "from app.db.models import Base, Document, Job; from sqlalchemy import create_engine; e = create_engine('sqlite:////tmp/officerpath-ci-test.db'); Base.metadata.create_all(e, tables=[Document.__table__, Job.__table__])"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install detect-secrets==1.5.0
      - name: Dependency audit
        run: pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Secret scan (detect-secrets vs committed baseline)
        run: detect-secrets scan --baseline .secrets.baseline

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t officerpath-pdf-engine:ci .
