# OfficerPath AI — PDF Engine CI (Phase 1, M1)
# Runs on every push / pull request to main or officerpath-phase1-engine.
# Gates: ruff (lint + format), mypy (new M1 packages), pytest, pip-audit
# (dependency audit), detect-secrets (secret scan), Alembic up/down on
# SQLite, Docker image build.
# Does NOT deploy, does NOT touch live Supabase, does NOT push any image.
# Deploy is a separate, owner-approved step (docs/deploy-render.md).
name: CI

on:
  push:
    branches: [main, officerpath-phase1-engine]
  pull_request:
    branches: [main, officerpath-phase1-engine]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Mypy (M1 packages)
        run: mypy app/db app/pipeline app/storage

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Alembic up/down (SQLite test target)
        env:
          DATABASE_URL: sqlite:////tmp/officerpath-ci-test.db
        run: |
          rm -f /tmp/officerpath-ci-test.db
          python -c "from app.db.models import Base, Document, Job; from sqlalchemy import create_engine; e = create_engine('sqlite:////tmp/officerpath-ci-test.db'); Base.metadata.create_all(e, tables=[Document.__table__, Job.__table__])"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install detect-secrets==1.5.0
      - name: Dependency audit
        run: pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Secret scan (detect-secrets vs committed baseline)
        run: detect-secrets scan --baseline .secrets.baseline

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t officerpath-pdf-engine:ci .
