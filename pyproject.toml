# OfficerPath AI — PDF Engine (Phase 1, M1)
# Tool configuration. Ruff = lint + format check; mypy = type checks.
# CI runs: `ruff check .`, `ruff format --check .`, `mypy app/db app/pipeline app/storage`.
# mypy scope is the new M1 packages only: the Phase 1A skeleton predates
# strict typing and is brought under mypy incrementally (see M1 report).

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101"]
"alembic/*" = ["E402"]

[tool.ruff.format]
# line-length is inherited from [tool.ruff] above.
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
disallow_any_generics = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

# Per-module strictness: new M1 packages are fully typed.
[[tool.mypy.overrides]]
module = ["app.db.*", "app.pipeline.*", "app.storage.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
