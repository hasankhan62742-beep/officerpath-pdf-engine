# OfficerPath AI — PDF Engine (Phase 1, M1)
# Alembic configuration. The database URL is NOT stored here: env.py
# reads DATABASE_URL from the environment (via app.config.settings).
# Run:  DATABASE_URL=postgresql+psycopg://... alembic upgrade head
# Local test target: DATABASE_URL=sqlite:////tmp/officerpath-test.db
# (SQLite is a TEST-ONLY target — see docs/migration-015-apply.md for
# the Postgres-only parts it cannot verify: RLS, gen_random_uuid,
# storage bucket, CHECK-constraint rewrites).

[alembic]
script_location = alembic
prepend_sys_path = .
sourceless = false
version_path_separator = os
output_encoding = utf-8
sqlalchemy.url = sqlite://

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
